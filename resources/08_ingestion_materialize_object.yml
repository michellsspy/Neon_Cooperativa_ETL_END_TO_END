resources:
  jobs:
    ingestion_materialize_object:
      name: ingestion_materialize_object

      parameters:
        - name: run_object_id
          default: ""

      tasks:
        - task_key: materialize_object

          # Retry de tarefa permanece desabilitado enquanto o ledger
          # de novas tentativas (attempt_number > 1) nao estiver
          # orquestrado explicitamente.
          max_retries: 0
          retry_on_timeout: false

          spark_python_task:
            python_file: ../src/ingestion/materialize_landing_object.py

            parameters:
              - --catalog
              - ${var.catalog_name}

              - --run-object-id
              - "{{job.parameters.run_object_id}}"

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
