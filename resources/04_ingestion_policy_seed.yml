resources:

  jobs:

    controller_seed_ingestion_policy:
      name: controller_seed_ingestion_policy

      tasks:

        - task_key: seed_ingestion_policy

          spark_python_task:
            python_file: ../src/bootstrap/seed_ingestion_policy.py

            parameters:
              - --catalog
              - ${var.catalog_name}

          environment_key: default

      environments:

        - environment_key: default

          spec:
            environment_version: "2"