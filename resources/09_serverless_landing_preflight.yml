resources:

  jobs:

    serverless_landing_preflight:
      name: serverless_landing_preflight

      tasks:

        - task_key: validate_serverless_landing

          spark_python_task:

            python_file: ../src/preflight/serverless_landing_preflight.py

            parameters:

              - --catalog
              - ${var.catalog_name}

              - --landing-volume
              - ${var.landing_volume_name}

              - --orchestrator-run-id
              - "{{job.run_id}}"

          environment_key: default

      environments:

        - environment_key: default

          spec:
            environment_version: "2"