resources:

  jobs:

    controller_bootstrap_ingestion_run_model:
      name: controller_bootstrap_ingestion_run_model

      tasks:

        - task_key: bootstrap_ingestion_run_model

          spark_python_task:
            python_file: ../src/bootstrap/create_ingestion_run_model.py

            parameters:
              - --catalog
              - ${var.catalog_name}

          environment_key: default

      environments:

        - environment_key: default

          spec:
            environment_version: "2"