resources:
  jobs:

    controller_bootstrap:
      name: controller_bootstrap

      tasks:
        - task_key: create_controller_core

          spark_python_task:
            python_file: ../src/bootstrap/create_controller_core.py

            parameters:
              - --catalog
              - ${var.catalog_name}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"