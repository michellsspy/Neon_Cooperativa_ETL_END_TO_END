resources:

  jobs:

    ingestion_reconcile_run:
      name: ingestion_reconcile_run

      parameters:

        - name: run_id
          default: ""

      tasks:

        - task_key: reconcile_run

          max_retries: 0
          retry_on_timeout: false

          spark_python_task:

            python_file: ../src/ingestion/reconcile_ingestion_run.py

            parameters:

              - --catalog
              - ${var.catalog_name}

              - --run-id
              - "{{job.parameters.run_id}}"

          environment_key: default

      environments:

        - environment_key: default

          spec:
            environment_version: "2"